[project]
name = "climbvla"
version = "0.1.0"
description = "Climbing rating app"
readme = "README.md"
authors = [
    { name = "RomaneCastel", email = "romane.castel@outlook.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.3",
]

[project.scripts]
climbvla = "climbvla:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
